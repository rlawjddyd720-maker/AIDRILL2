<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>전문대학 혁신지원사업 성과관리 시스템 | 경북과학대학교</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="./" aria-label="경북과학대학교 전문대학 혁신지원사업 성과관리 시스템 처음 화면">
      <span class="brand-logo">
        <img src="logo.png" alt="경북과학대학교" onerror="this.parentNode.classList.add('no-logo')">
        <span class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V10l7-5 7 5v11"/><path d="M9 21v-6h6v6"/></svg>
        </span>
      </span>
      <span class="brand-text">
        <span class="brand-sub" id="brandUniv">경북과학대학교</span>
        <span class="brand-title">전문대학 혁신지원사업 성과관리 시스템</span>
      </span>
    </a>
    <div class="top-actions">
      <span class="sync" id="syncState" aria-live="polite">연결 중</span>
      <button type="button" class="btn-ghost" id="themeBtn" aria-pressed="false">다크 모드</button>
      <button type="button" class="btn-report" id="reportBtn" aria-haspopup="dialog">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
        AI 요약 보고서
      </button>
      <button type="button" class="btn-gold" id="editBtn">실적 입력</button>
    </div>
  </div>
</header>

<main class="wrap" id="app">
  <p class="loading">데이터를 불러오는 중입니다.</p>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <span id="footSource">출처: 자율성과지표 정의서·1차년도 달성도, 2026학년도 자율성과지표 2분기 현황</span>
    <span id="footUpdated"></span>
  </div>
</footer>

<dialog id="editDialog" aria-labelledby="editTitle">
  <form method="dialog" id="editForm" class="edit-form">
    <div class="edit-head">
      <h2 id="editTitle">2차년도 실적 입력</h2>
      <button type="button" class="icon-btn" id="editClose" aria-label="닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="edit-body" id="editBody"></div>
    <div class="edit-foot">
      <label class="field inline">
        <span>입력자</span>
        <input type="text" id="editorName" maxlength="40" placeholder="이름 또는 부서" required>
      </label>
      <div class="edit-foot-btns">
        <button type="button" class="btn-line" id="editCancel">취소</button>
        <button type="submit" class="btn-primary" id="editSave">저장</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="reportDialog" class="report-dialog" aria-labelledby="reportTitle">
  <div class="report-wrap">
    <div class="edit-head">
      <div>
        <h2 id="reportTitle">AI 요약 보고서</h2>
        <p class="report-meta" id="reportMeta"></p>
      </div>
      <button type="button" class="icon-btn" id="reportClose" aria-label="닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="report-tabs">
      <div class="seg" role="group" aria-label="요약 방식">
        <button type="button" data-rtab="ai" aria-pressed="true">AI 요약</button>
        <button type="button" data-rtab="auto" aria-pressed="false">자동 요약</button>
      </div>
      <span class="report-note" id="reportNote"></span>
    </div>
    <article class="report-body" id="reportBody" aria-live="polite"></article>
    <div class="edit-foot">
      <span class="report-meta" id="reportStamp"></span>
      <div class="edit-foot-btns">
        <button type="button" class="btn-line" id="reportGen" hidden>AI 요약 생성</button>
        <button type="button" class="btn-line" id="reportCopy">복사</button>
        <button type="button" class="btn-line" id="reportPrint">인쇄</button>
        <button type="button" class="btn-primary" id="reportOk">닫기</button>
      </div>
    </div>
  </div>
</dialog>

<dialog id="historyDialog" class="report-dialog" aria-labelledby="historyTitle">
  <div class="report-wrap">
    <div class="edit-head">
      <h2 id="historyTitle">변경 이력</h2>
      <button type="button" class="icon-btn" id="historyClose" aria-label="닫기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="report-body" id="historyBody"></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
<script src="report.js"></script>
</body>
</html>
